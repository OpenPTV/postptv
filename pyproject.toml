[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtracks"
dynamic = ["version"]   # from git tags (setuptools-scm); see RELEASE.md
description = "Library for handling 3D PTV trajectory databases and Lagrangian/Eulerian turbulence post-processing."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yosef Meller", email = "yosefm@gmail.com" }]
license = "GPL-3.0-only AND BSD-3-Clause"
license-files = ["LICENSE.txt", "LICENSES/*"]
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "pyyaml",
    "zarr>=3.0.0",
    "xarray>=2024.1.0",
    "matplotlib",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering"
]

[project.scripts]
postptv-combine = "flowtracks.combine:main"

[tool.setuptools_scm]
# vX.Y.Z tag -> X.Y.Z; N commits after it -> X.Y.(Z+1).devN. No local
# "+g<sha>" suffix: PyPI rejects local versions, and every master push is
# published as a development release (pip skips those unless asked).
version_file = "flowtracks/_version.py"
local_scheme = "no-local-version"

[project.optional-dependencies]
# flowtracks/flux.py centerline() (3D skeleton of the fluid domain).
# Import-guarded at call time; the rest of flowtracks.flux needs nothing extra.
flux = ["scikit-image"]
# flowtracks/writers.py (pyvista-based .vtp/.vti/.vtr/.pvd ParaView export).
# Import-guarded at call time, so this is a convenience installer.
vtk = ["vtk", "pyvista"]
# flowtracks/io.py legacy NPZ/HDF5 scene reader (pytables-based).
legacy-io = ["tables"]
# eulerian.save_netcdf / save_dataset("*.nc"): optional NetCDF output. Zarr
# (save_zarr, the default of save_dataset) needs no extra.
netcdf = ["netcdf4"]
# examples/*.py marimo notebooks (interactive demos; matplotlib is already a
# core dependency, plotly covers the 3D trajectory viewers, tables/pytables
# loads the data/*.h5 demo datasets via Scene). Was previously undeclared --
# notebooks only ran via an ad hoc `--with marimo`.
notebooks = [
    "marimo>=0.24.2",
    "plotly>=7.0.0",
    "tables",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-benchmark",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Same lint gate as the sibling repos (openptv2, openptv-cloud), so one
# `ruff check` means the same thing across the stack.
target-version = "py312"
line-length = 88
# Notebooks are flat cell sequences: ruff sees one module and reports
# undefined names and import order that do not exist at runtime. Same for
# marimo notebooks, where a cell variable (e.g. `target_dir`) is defined
# and returned by another cell.
extend-exclude = ["*.ipynb", "examples/marimo_*.py", "examples/visualize_marimo.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
# E501: line length is not enforced in this codebase; leaving it on kept
# `ruff check` permanently red and therefore useless as a gate.
# E701: `if cond: return` one-liners are the deliberate compact style of the
# legacy readers (flowtracks/io.py, scene.py).
# E741: `l`, `I` mirror matrix names in the C/Python originals.
ignore = ["E501", "E701", "E741"]

[tool.ruff.lint.per-file-ignores]
# src/ stays strict. These carve-outs are for trees that are not shipped.
# E402: imports after a sys.path tweak. F401: availability probes
# (`import tables` inside try/except) and notebook helpers.
# F841: values bound for readability in exploratory/demo code.
"examples/**" = ["E402", "F401", "F841", "B018"]
"scripts/**" = ["E402", "F401", "F841"]
"benchmarks/**" = ["E402", "F401", "F841"]
"doc/**" = ["E402", "F401"]
# F401: test modules import names to prove they are importable / to be
# used by other tests via `from test_x import ...`.
"tests/**" = ["E402", "F401"]
