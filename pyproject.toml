[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtracks"
version = "1.2.1"
description = "Library for handling 3D PTV trajectory databases and Lagrangian/Eulerian turbulence post-processing."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yosef Meller", email = "yosefm@gmail.com" }]
license = { file = "LICENSE.txt" }
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "pyyaml",
    "netcdf4",
    "zarr>=3.0.0",
    "xarray>=2024.1.0",
    "matplotlib",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering"
]

[project.optional-dependencies]
# flowtracks/writers.py (pyvista-based .vtp/.vti/.vtr/.pvd ParaView export)
# and the legacy flowtracks/vtk_export.py + eulerian.export_vtk* (raw vtk).
# Both are import-guarded at call time, so this is a convenience installer.
vtk = ["vtk", "pyvista"]
# flowtracks/io.py legacy NPZ/HDF5 scene reader (pytables-based).
legacy-io = ["tables"]
# examples/*.py marimo notebooks (interactive demos; matplotlib is already a
# core dependency, plotly covers the 3D trajectory viewers, tables/pytables
# loads the data/*.h5 demo datasets via Scene). Was previously undeclared --
# notebooks only ran via an ad hoc `--with marimo`.
notebooks = [
    "marimo>=0.24.2",
    "plotly>=7.0.0",
    "tables",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-benchmark",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
