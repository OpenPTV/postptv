name: Python Package

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest numpy scipy tables vtk
        python -m pip install -e .
    - name: Test with pytest
      run: |
        pytest

# NOTE: this workflow never publishes. The single deploy path is
# python-publish.yml (release-event). Keeping publishing here as well
# would double-publish every release (and fail on file-name reuse).
