# Publishes flowtracks to PyPI (trusted publishing, environment "pypi"):
#
# - every push to master -> a DEVELOPMENT release, X.Y.(Z+1).devN, N = commits
#   since the last vX.Y.Z tag (setuptools-scm). pip and uv skip development
#   releases unless asked for one (`pip install --pre`, or a requirement such
#   as `flowtracks>=1.5.2.dev3`), so stable users are unaffected while
#   downstream projects can pin the newest code;
# - a published GitHub release (tag vX.Y.Z) -> the stable X.Y.Z.
#
# Tests and ruff gate both. This is the only workflow that publishes.

name: Upload Python Package

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "doc/**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff tables vtk pyvista scikit-image
          python -m pip install -e .
          pytest -q
          ruff check .

  release-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # setuptools-scm derives the version from tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Check the version
        run: |
          VERSION=$(ls dist/*.whl | sed -E 's/.*flowtracks-([^-]+)-.*/\1/')
          echo "Built version: $VERSION"
          if [ "${{ github.event_name }}" = "release" ]; then
            # a release must build exactly its tag's version (v1.2.2 -> 1.2.2)
            if [ "$VERSION" != "${GITHUB_REF#refs/tags/v}" ]; then
              echo "Error: tag ${GITHUB_REF#refs/tags/} builds $VERSION"; exit 1
            fi
          else
            case "$VERSION" in *.dev*) ;; *) echo "Error: $VERSION is not a dev version"; exit 1 ;; esac
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/flowtracks

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true     # a re-run of the same commit is not an error
